<!DOCTYPE html>
<html>
<head>
    <title>Compliance Intelligence</title>
    <script src="https://cdn.tailwindcss.com"></script>
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-100">

<div class="flex h-screen">

    <!-- Sidebar -->
    <div class="w-64 bg-gray-900 text-white p-5">
        <h2 class="text-xl font-bold mb-6">Compliance AI</h2>
        <ul class="space-y-3">
            <li><a href="/dashboard-ui" class="hover:text-gray-300">Dashboard</a></li>
            <li><a href="#" class="hover:text-gray-300">Reports</a></li>
            <li><button onclick="logout()" class="text-left w-full hover:text-gray-300">Logout</button></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="flex-1 p-8 overflow-auto">
        {% block content %}{% endblock %}
    </div>

</div>

<script>
function logout() {
    localStorage.removeItem("token");
    window.location.href = "/login";
}
</script>

</body>
</html>
